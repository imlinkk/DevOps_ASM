global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "devops-asm"

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "devops-node-api"
    metrics_path: /metrics
    static_configs:
      - targets: ["app:5000"]
    scrape_interval: 10s
